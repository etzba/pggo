name: Determine known CVEs through `govulncheck`
on:
  push:
    branches:
      - b-upgrade-go-packages
      - master

jobs:
  check-for-vulnerabilities:
    name: Check for vulnerabilities using `govulncheck`
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Run govulncheck (symbol-level analysis)
        run: |
          govulncheck -format=sarif ./… > govulncheck.sarif || true
          cat govulncheck.sarif
      - name: Upload vulnerability report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: govulncheck.sarif
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          output-format: sarif
          output-file: govulncheck.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
