apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    app: {{ .Values.api.name }}
  annotations:
    etzba.com/image-updater: enabled
spec:
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/metrics'
        prometheus.io/port: '8080'
    spec:
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
              name: http-pggo
              protocol: TCP   
          resources:
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
          env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: {{ .Values.pg.name }}-sec
                key: postgres_database
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.pg.name }}-sec
                key: postgres_user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.pg.name }}-sec
                key: postgres_password
          - name: DATABASE_SSL
            value: disable
          - name: POSTGRES_PORT
            value: "{{ .Values.pg.containerPort }}"
          - name: POSTGRES_HOST
            value: {{ .Values.pg.name }}
          - name: RELEASE_STAGE
            value: testing
