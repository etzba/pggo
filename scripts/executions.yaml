{{ $baseUrl := printf "%s" "http://localhost:8080" }}
{{ $slice := makeIntSliceBySum 100 }}

api:
{{ range $slice }}
- url: {{ $baseUrl }}/locations
  method: POST
  payload: '{ "name": {{ getRandStringInLength 5 }}, "address": {{ getRandStringInLength 23 }},  {{ getFloatInRange 70 90 }}, "latitude": {{ getFloatInRange -80 -60 }}}'
- url: {{ $baseUrl }}/locations
  method: POST
  data: 
    name: {{ getRandStringInLength 5 }}
    address: {{ getRandStringInLength 23 }}
    longtitude: {{ getFloatInRange 70 90 }}
    latitude: {{ getFloatInRange -80 -60 }}
{{ end }}
{{ range $slice }}
- url: {{ $baseUrl }}/locations/{{ . }}
  method: GET
{{ end }}
- url: {{ $baseUrl }}/locations/
  method: GET
{{ range $slice }}
- url: {{ $baseUrl }}/locations/{{ . }}
  method: DELETE
{{ end }}
{{ range $slice }}
- url: {{ $baseUrl }}/locations/{{ . }}
  method: PUT
  payload: '{ "name": "Etz", "address": "Etzba str. 123 12345",  "longtitude": {{ getFloatInRange 70 90 }}, "latitude": {{ getFloatInRange -80 -60 }} }'
{{ end }}